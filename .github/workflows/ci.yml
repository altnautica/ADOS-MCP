name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  clean-for-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The named half of the sweep lives in a private denylist that is never
      # committed, so CI materializes it from a repository secret and declares it
      # mandatory. Without this the job would only ever run the structural half.
      - name: Clean-for-public sweep
        env:
          ADOS_DENYLIST: ${{ secrets.ADOS_DENYLIST }}
        run: |
          # Only materialize the file when the secret actually has content: an
          # empty file would load zero named patterns and the run would read as a
          # full pass, which is the failure mode this wiring exists to remove.
          if [ -n "${ADOS_DENYLIST//[[:space:]]/}" ]; then
            printf '%s\n' "$ADOS_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          fi
          ADOS_DENYLIST_FILE="$RUNNER_TEMP/denylist.txt" \
          ADOS_DENYLIST_REQUIRED=1 \
            bash scripts/clean-for-public.sh
