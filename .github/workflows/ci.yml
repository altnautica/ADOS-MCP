name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  clean-for-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This job runs the STRUCTURAL half of the sweep only, and says so.
      #
      # The named half is a list of sensitive literals that is deliberately
      # never committed, so it is absent on every runner. The obvious wiring —
      # materialize it from a repository secret and mark it mandatory — would
      # upload that list to a third party in order to guard a repository it is
      # not published in. The list is the most sensitive file in the estate;
      # publishing it is worse than publishing any single term on it.
      #
      # So the named half is enforced where the commit is actually made, by the
      # boundary guard in the private monorepo, which reads the list from disk,
      # scans every public tree rather than just this one, and never prints a
      # matched term. That gate blocks the commit; this job cannot, because it
      # runs after the fact.
      #
      # `ADOS_DENYLIST_REQUIRED` is deliberately NOT set: the sweep prints a
      # warning naming what it did not cover and exits 0. A job that fails on
      # every run for a structural reason gets muted, and a muted gate catches
      # nothing. What must never happen is the third state this replaced —
      # printing "sweep passed" while silently skipping the named half.
      - name: Clean-for-public sweep (structural half)
        run: bash scripts/clean-for-public.sh
